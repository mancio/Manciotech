name: Validate website pull requests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build-seo.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/recipes-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run automated tests
        run: CI=true npm test -- --watch=false --runInBand
      - name: Production build
        if: success() || failure()
        run: npm run build

  baseline:
    name: Compare existing main tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout unmodified main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run baseline tests (record existing failures)
        continue-on-error: true
        run: CI=true npm test -- --watch=false --runInBand
